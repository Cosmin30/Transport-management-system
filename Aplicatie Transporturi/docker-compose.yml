version: '3.8'

services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: transport-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Transport@2024!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Transport@2024!" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transport-network

  # .NET Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transport-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=AplicatieTransporturi;User Id=sa;Password=Transport@2024!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - TokenKey=zImQYFBS3PKw2RsDSb108eNXfOCZ/O27fX2HUZ6VIwwi+JAv708l8ZJJjNzhsDrqc0wbsUNLfoXtlXirti29BQ==
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transport-network

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transport-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - transport-network

networks:
  transport-network:
    driver: bridge

volumes:
  mssql_data:
