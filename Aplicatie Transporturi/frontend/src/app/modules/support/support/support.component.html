<div class="container mt-5" style="max-width: 720px;">
    <h2 class="mb-4 text-center">Suport clienți</h2>
  
    <div class="accordion" id="faqAccordion">
  
      <div class="accordion-item">
        <h2 class="accordion-header" id="faq1">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapse1">
            Cum pot crea o cursă nouă?
          </button>
        </h2>
        <div id="collapse1" class="accordion-collapse collapse show" aria-labelledby="faq1" data-bs-parent="#faqAccordion">
          <div class="accordion-body">
            Accesează pagina <a routerLink="/deliveries" class="text-primary text-decoration-underline">Curse</a> și apasă butonul „Adaugă cursă”.
          </div>
        </div>
      </div>
  
      <div class="accordion-item">
        <h2 class="accordion-header" id="faq2">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse2">
            Cum editez un șofer?
          </button>
        </h2>
        <div id="collapse2" class="accordion-collapse collapse" aria-labelledby="faq2" data-bs-parent="#faqAccordion">
          <div class="accordion-body">
            Mergi în secțiunea <a routerLink="/drivers" class="text-primary text-decoration-underline">Șoferi</a> și selectează opțiunea „Editează”.
          </div>
        </div>
      </div>
  
      <div class="accordion-item">
        <h2 class="accordion-header" id="faq3">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse3">
            Cum pot contacta echipa de suport?
          </button>
        </h2>
        <div id="collapse3" class="accordion-collapse collapse" aria-labelledby="faq3" data-bs-parent="#faqAccordion">
          <div class="accordion-body">
            Ne poți scrie pe email la <a href="mailto:contact&#64;transportapp.ro">contact&#64;transportapp.ro</a> sau suna la 0740 123 456.
          </div>
        </div>
      </div>
  
      <div class="accordion-item">
        <h2 class="accordion-header" id="faq4">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse4">
            Cum pot adăuga un vehicul nou?
          </button>
        </h2>
        <div id="collapse4" class="accordion-collapse collapse" aria-labelledby="faq4" data-bs-parent="#faqAccordion">
          <div class="accordion-body">
            Mergi în pagina <a routerLink="/vehicles" class="text-primary text-decoration-underline">Vehicule</a> și apasă „Adaugă vehicul”.
          </div>
        </div>
    </div>
    </div>
  </div>
