<h2 class="text-center mb-4 text-success">
    {{ isEditMode ? 'Editează Vehicul' : 'Adaugă Vehicul' }}
  </h2>
  
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto" style="max-width: 600px;">
    <div *ngIf="isEditMode && vehicleId" class="mb-3 text-muted">
      <strong>ID Vehicul:</strong> {{ vehicleId }}
    </div>
    
    <div class="mb-3">
      <label for="licensePlate" class="form-label">Număr Înmatriculare</label>
      <input id="licensePlate" type="text" formControlName="licensePlate" class="form-control" placeholder="Ex: B123XYZ" />
    </div>
  
    <div class="mb-3">
      <label for="model" class="form-label">Model</label>
      <input id="model" type="text" formControlName="model" class="form-control" placeholder="Ex: Dacia Logan" />
    </div>
  
    <div class="mb-3">
      <label for="year" class="form-label">An fabricație</label>
      <input id="year" type="number" formControlName="year" class="form-control" placeholder="Ex: 2021" />
    </div>
  
    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" id="isAvailable" formControlName="isAvailable" />
      <label class="form-check-label" for="isAvailable">Disponibil</label>
    </div>
  
    <div class="d-flex justify-content-end gap-2">
      <button type="submit" class="btn btn-success" [disabled]="form.invalid">
        <i class="fas fa-save me-1"></i> Salvează
      </button>
      <button type="button" class="btn btn-secondary" (click)="router.navigate(['/vehicles'])">
        <i class="fas fa-times me-1"></i> Anulează
      </button>
    </div>
  </form>
