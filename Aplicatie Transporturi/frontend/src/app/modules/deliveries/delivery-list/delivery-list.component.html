<div class="delivery-list">
  <h2>Lista curselor</h2>

  <div *ngIf="deliveries.length === 0" class="alert alert-info">
    Nu există curse disponibile momentan.
  </div>

  <div class="row" *ngIf="deliveries.length > 0">
    <div class="col-md-4 mb-4" *ngFor="let c of deliveries">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">Destinație: {{ c.destination }}</h5>
          <p class="card-text">Data: {{ c.date | date: 'dd/MM/yyyy HH:mm' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
