<div class="container mt-5">
  <div class="mx-auto" style="max-width: 400px;">
    <div class="card p-4 shadow">
      <h3 class="text-center mb-4">Transport App - {{ isLogin ? 'Login' : 'Register' }}</h3>

      <div class="text-center mb-3">
        <button class="btn btn-outline-primary me-2" [disabled]="isLogin" (click)="toggleTab()">Login</button>
        <button class="btn btn-outline-secondary" [disabled]="!isLogin" (click)="toggleTab()">Register</button>
      </div>

      <!-- Login Form -->
      <form *ngIf="isLogin" (ngSubmit)="login()">
        <div class="mb-3">
          <label>Username</label>
          <input class="form-control" [(ngModel)]="loginData.username" name="username" required />
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" [(ngModel)]="loginData.password" name="password" required />
        </div>
        <button type="submit" class="btn btn-success w-100">Login</button>
      </form>

      <!-- Register Form -->
      <form *ngIf="!isLogin" (ngSubmit)="register()">
        <div class="mb-3">
          <label>Username</label>
          <input class="form-control" [(ngModel)]="registerData.username" name="regUsername" required />
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" [(ngModel)]="registerData.password" name="regPassword" required />
        </div>
        <div class="mb-3">
          <label>Confirm Password</label>
          <input type="password" class="form-control" [(ngModel)]="registerData.confirmPassword" name="regConfirmPassword" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>
    </div>
  </div>
</div>
