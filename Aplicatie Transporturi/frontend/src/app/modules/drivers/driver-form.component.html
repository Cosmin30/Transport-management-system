<h2 class="text-center mb-4 text-primary">
  {{ isEditMode ? 'Editează Șofer' : 'Adaugă Șofer' }}
</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto" style="max-width: 600px;">
  <!-- afișează ID-ul în modul edit -->
  <div *ngIf="isEditMode && driverId" class="mb-3 text-muted">
    <strong>ID Șofer:</strong> {{ driverId }}
  </div>

  <div class="mb-3">
    <label for="name" class="form-label">Nume</label>
    <input id="name" type="text" formControlName="name" class="form-control" placeholder="Ex: Ion Popescu">
  </div>

  <div class="mb-3">
    <label for="licenseNumber" class="form-label">Număr Permis</label>
    <input id="licenseNumber" type="text" formControlName="licenseNumber" class="form-control" placeholder="Ex: RO123456">
  </div>

  <div class="form-check form-switch mb-3">
    <input id="isAvailable" type="checkbox" formControlName="isAvailable" class="form-check-input">
    <label for="isAvailable" class="form-check-label">Disponibil</label>
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div class="d-flex justify-content-end gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isLoading">
      <i class="fas fa-save me-1"></i>
      {{ isEditMode ? 'Actualizează' : 'Salvează' }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="router.navigate(['/drivers'])">
      <i class="fas fa-times me-1"></i> Anulează
    </button>
  </div>
</form>
